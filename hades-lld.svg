<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc"><title id="title">Hades low-level design</title><desc id="desc">Architecture and behavior of the Hades in-memory string store: caller to public API, sync.Mutex, map of entries, and write, read, expiry, and error rules.</desc><rect width="800" height="600" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker></defs><text x="30" y="34.8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1e1e1e" text-anchor="start"><tspan x="30" dy="0">Hades — Simple LLD</tspan></text><text x="30" y="59.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#495057" text-anchor="start"><tspan x="30" dy="0">Redis-style in-memory string store · Go library · no server</tspan></text><text x="30" y="79.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#495057" text-anchor="start"><tspan x="30" dy="0">Architecture</tspan></text><text x="300" y="79.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#495057" text-anchor="start"><tspan x="300" dy="0">Behavior</tspan></text><rect x="30" y="92" width="240" height="50" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" stroke-linejoin="round"/><text x="150" y="110.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle"><tspan x="150" dy="0">Caller</tspan><tspan x="150" dy="17.5">main.go · tests</tspan></text><line x1="150" y1="142" x2="150" y2="154" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="154" width="240" height="108" rx="8" fill="#f8f9fa" stroke="#4a9eed" stroke-width="2" stroke-linejoin="round"/><text x="44" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e" text-anchor="start"><tspan x="44" dy="0">Store — public API</tspan></text><text x="44" y="197.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#343a40" text-anchor="start"><tspan x="44" dy="0">Set · Get · SetWithTTL</tspan><tspan x="44" dy="17.5">Delete · Rename · Pop</tspan><tspan x="44" dy="17.5">Len · Sweep</tspan></text><line x1="150" y1="262" x2="150" y2="276" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="276" width="240" height="50" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2" stroke-linejoin="round"/><text x="150" y="294.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle"><tspan x="150" dy="0">sync.Mutex</tspan><tspan x="150" dy="17.5">one lock per call</tspan></text><line x1="150" y1="326" x2="150" y2="340" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="340" width="240" height="86" rx="8" fill="#c3fae8" stroke="#06b6d4" stroke-width="2" stroke-linejoin="round"/><text x="150" y="376.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle"><tspan x="150" dy="0">map[string]Entry</tspan><tspan x="150" dy="17.5">key → value + expireAt</tspan></text><line x1="150" y1="426" x2="150" y2="440" stroke="#495057" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="440" width="240" height="80" rx="8" fill="#c3fae8" stroke="#06b6d4" stroke-width="2" stroke-linejoin="round"/><text x="150" y="473.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e" text-anchor="middle"><tspan x="150" dy="0">Entry{value, expireAt}</tspan><tspan x="150" dy="17.5">zero expireAt = no TTL</tspan></text><rect x="30" y="522" width="240" height="58" rx="8" fill="#e5dbff" stroke="#8b5cf6" stroke-width="1" stroke-linejoin="round"/><text x="44" y="544.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#343a40" text-anchor="start"><tspan x="44" dy="0">Every call is one</tspan><tspan x="44" dy="17.5">atomic transition</tspan></text><rect x="300" y="92" width="470" height="128" rx="8" fill="#f8f9fa" stroke="#8b5cf6" stroke-width="2" stroke-linejoin="round"/><text x="316" y="114.8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start"><tspan x="316" dy="0">1 · Write — Set / SetWithTTL</tspan></text><text x="316" y="143.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#343a40" text-anchor="start"><tspan x="316" dy="0">• lock s.mu</tspan><tspan x="316" dy="17.5">• new key at capacity: sweep, then ErrOOM</tspan><tspan x="316" dy="17.5">• data[key] = Entry{value, expireAt}</tspan><tspan x="316" dy="17.5">• Set clears TTL; SetWithTTL sets it</tspan></text><rect x="300" y="232" width="470" height="128" rx="8" fill="#f8f9fa" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/><text x="316" y="254.8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start"><tspan x="316" dy="0">2 · Read — Get / Pop</tspan></text><text x="316" y="283.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#343a40" text-anchor="start"><tspan x="316" dy="0">• lock s.mu</tspan><tspan x="316" dy="17.5">• missing key → ("", false)</tspan><tspan x="316" dy="17.5">• expired → delete + miss</tspan><tspan x="316" dy="17.5">• live → return value; Pop deletes first</tspan></text><rect x="300" y="372" width="470" height="128" rx="8" fill="#f8f9fa" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/><text x="316" y="394.8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="start"><tspan x="316" dy="0">3 · Expiry — per-key TTL</tspan></text><text x="316" y="423.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#343a40" text-anchor="start"><tspan x="316" dy="0">• expireAt is an absolute deadline</tspan><tspan x="316" dy="17.5">• lazy: deleted when read</tspan><tspan x="316" dy="17.5">• explicit: Sweep() deletes expired</tspan><tspan x="316" dy="17.5">• no background goroutine</tspan></text><rect x="300" y="516" width="470" height="64" rx="8" fill="#fff3bf" stroke="#f59e0b" stroke-width="1" stroke-linejoin="round"/><text x="316" y="537.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#343a40" text-anchor="start"><tspan x="316" dy="0">Sentinel errors: ErrNoSuchKey · ErrKeyExists</tspan><tspan x="316" dy="17.5">ErrOOM · ErrTimeCorrect · capacity counts keys</tspan></text></svg>